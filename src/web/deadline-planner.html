<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IB Deadline Planner</title>
    <style>
        /* Reset & Base */
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg: #0f0f13;
            --surface: #1a1a24;
            --surface2: #22222f;
            --border: #2e2e3e;
            --accent: #6c63ff;
            --accent2: #a78bfa;
            --success: #22c55e;
            --warning: #f59e0b;
            --danger: #ef4444;
            --text: #e2e8f0;
            --text-muted: #94a3b8;
            --ia-color: #6c63ff;
            --ee-color: #ec4899;
            --exam-color: #f59e0b;
            --other-color: #22c55e;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding: 24px 16px;
        }

        .container { max-width: 900px; margin: 0 auto; }

        /* Header */
        header { text-align: center; margin-bottom: 40px; }
        header h1 { font-size: 2.2rem; font-weight: 700; background: linear-gradient(135deg, var(--accent), var(--accent2)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
        header p { color: var(--text-muted); margin-top: 8px; font-size: 1rem; }

        /* Cards */
        .card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 24px; margin-bottom: 20px; }

        /* Form */
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        @media (max-width: 600px) { .form-grid { grid-template-columns: 1fr; } }
        .form-group { display: flex; flex-direction: column; gap: 6px; }
        .form-group.full { grid-column: 1 / -1; }
        label { font-size: 0.85rem; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; }
        input, select {
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text);
            padding: 10px 14px;
            font-size: 0.95rem;
            transition: border-color 0.2s;
            outline: none;
            width: 100%;
        }
        input:focus, select:focus { border-color: var(--accent); }
        select option { background: var(--surface); }

        /* Type selector */
        .type-selector { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
        .type-btn {
            background: var(--surface2);
            border: 2px solid var(--border);
            border-radius: 10px;
            color: var(--text-muted);
            padding: 10px 8px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }
        .type-btn:hover { border-color: var(--accent); color: var(--text); }
        .type-btn.active[data-type="IA"] { border-color: var(--ia-color); color: var(--ia-color); background: rgba(108,99,255,0.1); }
        .type-btn.active[data-type="EE"] { border-color: var(--ee-color); color: var(--ee-color); background: rgba(236,72,153,0.1); }
        .type-btn.active[data-type="exam"] { border-color: var(--exam-color); color: var(--exam-color); background: rgba(245,158,11,0.1); }
        .type-btn.active[data-type="other"] { border-color: var(--other-color); color: var(--other-color); background: rgba(34,197,94,0.1); }

        /* Button */
        .btn {
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            border: none;
            border-radius: 10px;
            color: white;
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.1s;
            width: 100%;
            margin-top: 8px;
        }
        .btn:hover { opacity: 0.9; }
        .btn:active { transform: scale(0.99); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }

        /* Advanced toggle */
        .advanced-toggle { background: none; border: none; color: var(--text-muted); font-size: 0.85rem; cursor: pointer; padding: 8px 0; display: flex; align-items: center; gap: 6px; }
        .advanced-toggle:hover { color: var(--text); }
        .advanced-section { display: none; }
        .advanced-section.open { display: block; }

        /* Results */
        .result-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
        .result-header h2 { font-size: 1.2rem; font-weight: 700; }
        .badge { border-radius: 20px; padding: 4px 12px; font-size: 0.78rem; font-weight: 700; letter-spacing: 0.05em; }
        .badge-success { background: rgba(34,197,94,0.15); color: var(--success); }
        .badge-warning { background: rgba(245,158,11,0.15); color: var(--warning); }

        /* Task summary */
        .task-summary {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 12px;
            margin-bottom: 20px;
        }
        .stat-card { background: var(--surface2); border-radius: 10px; padding: 14px; text-align: center; }
        .stat-card .value { font-size: 1.6rem; font-weight: 700; color: var(--accent2); }
        .stat-card .label { font-size: 0.75rem; color: var(--text-muted); margin-top: 4px; text-transform: uppercase; letter-spacing: 0.05em; }

        /* Events list */
        .events-list { display: flex; flex-direction: column; gap: 8px; }
        .event-item {
            background: var(--surface2);
            border-radius: 10px;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            border-left: 3px solid var(--accent);
        }
        .event-item.type-IA { border-left-color: var(--ia-color); }
        .event-item.type-EE { border-left-color: var(--ee-color); }
        .event-item.type-exam { border-left-color: var(--exam-color); }
        .event-item.type-other { border-left-color: var(--other-color); }
        .event-date { font-size: 0.8rem; color: var(--text-muted); min-width: 100px; }
        .event-time { font-size: 0.8rem; color: var(--accent2); min-width: 110px; }
        .event-title { font-size: 0.9rem; font-weight: 500; flex: 1; }
        .event-num { font-size: 0.75rem; color: var(--text-muted); }

        /* Warning box */
        .warning-box { background: rgba(245,158,11,0.1); border: 1px solid rgba(245,158,11,0.3); border-radius: 10px; padding: 12px 16px; color: var(--warning); font-size: 0.88rem; margin-bottom: 16px; }

        /* Loading */
        .loading { text-align: center; padding: 32px; color: var(--text-muted); }
        .spinner { display: inline-block; width: 28px; height: 28px; border: 3px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 12px; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Error */
        .error-box { background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.3); border-radius: 10px; padding: 12px 16px; color: var(--danger); font-size: 0.88rem; }

        /* Task type pill */
        .type-pill { display: inline-block; border-radius: 6px; padding: 2px 8px; font-size: 0.75rem; font-weight: 700; }
        .type-pill.IA { background: rgba(108,99,255,0.2); color: var(--ia-color); }
        .type-pill.EE { background: rgba(236,72,153,0.2); color: var(--ee-color); }
        .type-pill.exam { background: rgba(245,158,11,0.2); color: var(--exam-color); }
        .type-pill.other { background: rgba(34,197,94,0.2); color: var(--other-color); }

        /* Empty state */
        #results { display: none; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>IB Deadline Planner</h1>
            <p>Add your IAs, EEs, and exams — we'll schedule study sessions that fit around your calendar.</p>
        </header>

        <div class="card">
            <form id="deadline-form">
                <!-- Task type selector -->
                <div class="form-group full" style="margin-bottom: 16px;">
                    <label>Task Type</label>
                    <div class="type-selector">
                        <button type="button" class="type-btn active" data-type="IA">&#x1F4DD; IA</button>
                        <button type="button" class="type-btn" data-type="EE">&#x1F4DA; EE</button>
                        <button type="button" class="type-btn" data-type="exam">&#x1F3AF; Exam</button>
                        <button type="button" class="type-btn" data-type="other">&#x270F;&#xFE0F; Other</button>
                    </div>
                    <input type="hidden" id="taskType" value="IA">
                </div>

                <div class="form-grid">
                    <div class="form-group full">
                        <label>Subject / Task Name</label>
                        <input type="text" id="taskName" placeholder="e.g. Biology IA, History EE, Math HL" required>
                    </div>
                    <div class="form-group">
                        <label>Deadline Date</label>
                        <input type="date" id="deadline" required>
                    </div>
                    <div class="form-group">
                        <label>Estimated Hours</label>
                        <input type="number" id="estimatedHours" min="1" max="500" placeholder="e.g. 20" required>
                    </div>
                </div>

                <!-- Advanced settings -->
                <div style="margin-top: 16px;">
                    <button type="button" class="advanced-toggle" onclick="toggleAdvanced()">
                        <span id="advanced-arrow">&#x25B6;</span> Advanced settings
                    </button>
                    <div class="advanced-section" id="advanced-section">
                        <div class="form-grid" style="margin-top: 12px;">
                            <div class="form-group">
                                <label>Session Duration (hours)</label>
                                <input type="number" id="sessionDuration" min="0.5" max="8" step="0.5" placeholder="2" value="2">
                            </div>
                            <div class="form-group">
                                <label>Start Scheduling From</label>
                                <input type="date" id="startDate">
                            </div>
                            <div class="form-group">
                                <label>Preferred Start Time</label>
                                <input type="time" id="preferredStart" value="16:00">
                            </div>
                            <div class="form-group">
                                <label>Preferred End Time</label>
                                <input type="time" id="preferredEnd" value="21:00">
                            </div>
                            <div class="form-group">
                                <label>Calendar ID</label>
                                <input type="text" id="calendarId" placeholder="primary">
                            </div>
                            <div class="form-group">
                                <label>Event Color (1-11)</label>
                                <select id="colorId">
                                    <option value="">Default</option>
                                    <option value="1">Tomato</option>
                                    <option value="2">Flamingo</option>
                                    <option value="3">Tangerine</option>
                                    <option value="4">Banana</option>
                                    <option value="5">Sage</option>
                                    <option value="6">Basil</option>
                                    <option value="7">Peacock</option>
                                    <option value="8">Blueberry</option>
                                    <option value="9">Lavender</option>
                                    <option value="10">Grape</option>
                                    <option value="11">Graphite</option>
                                </select>
                            </div>
                        </div>
                    </div>
                </div>

                <button type="submit" class="btn" id="submit-btn">Schedule Study Sessions</button>
            </form>
        </div>

        <div id="results">
            <!-- Populated by JS -->
        </div>
    </div>

    <script>
        // Set default deadline to 2 weeks from now
        const twoWeeks = new Date();
        twoWeeks.setDate(twoWeeks.getDate() + 14);
        document.getElementById('deadline').value = twoWeeks.toISOString().split('T')[0];

        // Type selector
        document.querySelectorAll('.type-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.type-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                document.getElementById('taskType').value = btn.dataset.type;
            });
        });

        // Advanced toggle
        function toggleAdvanced() {
            const section = document.getElementById('advanced-section');
            const arrow = document.getElementById('advanced-arrow');
            section.classList.toggle('open');
            arrow.textContent = section.classList.contains('open') ? '▼' : '▶';
        }

        // Format date nicely
        function formatDate(isoString) {
            const d = new Date(isoString);
            return d.toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' });
        }

        function formatTime(isoString) {
            const d = new Date(isoString);
            return d.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
        }

        // Form submit
        document.getElementById('deadline-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            const btn = document.getElementById('submit-btn');
            btn.disabled = true;
            btn.textContent = 'Scheduling…';

            const resultsDiv = document.getElementById('results');
            resultsDiv.style.display = 'block';
            resultsDiv.innerHTML = '<div class="card loading"><div class="spinner"></div><p>Finding free slots and creating sessions…</p></div>';

            const body = {
                taskName: document.getElementById('taskName').value.trim(),
                taskType: document.getElementById('taskType').value,
                deadline: document.getElementById('deadline').value,
                estimatedHours: parseFloat(document.getElementById('estimatedHours').value),
                sessionDurationHours: parseFloat(document.getElementById('sessionDuration').value) || 2,
                preferredStartTime: document.getElementById('preferredStart').value || '16:00',
                preferredEndTime: document.getElementById('preferredEnd').value || '21:00',
            };

            const startDate = document.getElementById('startDate').value;
            if (startDate) body.startDate = startDate;

            const calendarId = document.getElementById('calendarId').value.trim();
            if (calendarId) body.calendarId = calendarId;

            const colorId = document.getElementById('colorId').value;
            if (colorId) body.colorId = colorId;

            try {
                // Call the MCP server's schedule endpoint
                const response = await fetch('/api/schedule-deadline', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body),
                });

                if (!response.ok) {
                    const err = await response.json().catch(() => ({ error: response.statusText }));
                    throw new Error(err.error || 'Server error: ' + response.status);
                }

                const data = await response.json();
                renderResults(data, body.taskType);
            } catch (err) {
                resultsDiv.innerHTML = '<div class="card"><div class="error-box">❌ ' + err.message + '</div></div>';
            } finally {
                btn.disabled = false;
                btn.textContent = 'Schedule Study Sessions';
            }
        });

        function renderResults(data, taskType) {
            const { task, events, warnings } = data;
            const resultsDiv = document.getElementById('results');

            const allScheduled = task.sessionsUnscheduled === 0;
            const typeClass = taskType;

            let html = '<div class="card">' +
                '<div class="result-header">' +
                '<h2>' + task.name + ' <span class="type-pill ' + typeClass + '">' + task.type + '</span></h2>' +
                '<span class="badge ' + (allScheduled ? 'badge-success' : 'badge-warning') + '">' +
                (allScheduled ? '✓ Fully Scheduled' : '⚠ ' + task.sessionsUnscheduled + ' sessions unscheduled') +
                '</span>' +
                '</div>' +
                '<div class="task-summary">' +
                '<div class="stat-card"><div class="value">' + task.sessionsScheduled + '</div><div class="label">Sessions Added</div></div>' +
                '<div class="stat-card"><div class="value">' + task.estimatedHours + 'h</div><div class="label">Total Work</div></div>' +
                '<div class="stat-card"><div class="value">' + task.sessionDurationHours + 'h</div><div class="label">Per Session</div></div>' +
                '<div class="stat-card"><div class="value">' + task.deadline + '</div><div class="label">Deadline</div></div>' +
                '</div>';

            if (warnings && warnings.length > 0) {
                html += warnings.map(w => '<div class="warning-box">⚠️ ' + w + '</div>').join('');
            }

            if (events && events.length > 0) {
                html += '<div class="events-list">';
                events.forEach((ev, i) => {
                    const startStr = ev.start && ev.start.dateTime ? ev.start.dateTime : (ev.start && ev.start.date ? ev.start.date : '');
                    const endStr = ev.end && ev.end.dateTime ? ev.end.dateTime : (ev.end && ev.end.date ? ev.end.date : '');
                    html += '<div class="event-item type-' + typeClass + '">' +
                        '<div class="event-date">' + formatDate(startStr) + '</div>' +
                        '<div class="event-time">' + formatTime(startStr) + ' – ' + formatTime(endStr) + '</div>' +
                        '<div class="event-title">' + (ev.summary || task.name) + '</div>' +
                        '<div class="event-num">' + (i + 1) + '/' + task.sessionsScheduled + '</div>' +
                        '</div>';
                });
                html += '</div>';
            }

            html += '</div>';
            resultsDiv.innerHTML = html;
            resultsDiv.scrollIntoView({ behavior: 'smooth' });
        }
    </script>
</body>
</html>
